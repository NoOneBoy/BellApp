name: bellapp
description: Campanas emparejadas a distancia. Toca o agita y suenan las dos.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^4.2.1
  firebase_auth: ^6.1.2
  cloud_firestore: ^6.1.0
  firebase_messaging: ^16.0.4
  audioplayers: ^6.5.1
  sensors_plus: ^6.1.2
  shared_preferences: ^2.5.3
  permission_handler: ^12.0.1
  vibration: ^3.1.3
  wakelock_plus: ^1.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/bell.mp3
